name: Phase 1 Discovery
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Create Test Harness Files
        run: |
          mkdir -p tests
          cat <<EOF > tests/dummies.py
          class dummy_in(dict):
              def __init__(self, **kwargs):
                  super().__init__({'pipeline_id': 'default', 'config_ids': ['cfg1'], 'input_data_list': ['data.in']})
                  self.update(kwargs)
              def override(self, **kwargs):
                  self.update(kwargs)
                  return self

          class dummy_out(dict):
              def __init__(self, **kwargs):
                  super().__init__({'run_id': 'run_0', 'status': 'success', 'execution_time_seconds': 0.0, 'module_output': 'out.zip', 'error_log': None})
                  self.update(kwargs)
              def override(self, **kwargs):
                  self.update(kwargs)
                  return self
          EOF

      - name: Clone Mesh Generator Repo (Public)
        run: |
          git clone https://github.com/Dmitrii-Zavalin-Deployments/mesh_generator.git
          cd mesh_generator
          if [ -f "mesh_generator.yml" ]; then
            echo "SUCCESS: mesh_generator.yml found."
          else
            echo "ERROR: mesh_generator.yml missing!"
            exit 1
          fi

      - name: Run Test Logic (solve function)
        shell: python
        run: |
          from tests.dummies import dummy_in, dummy_out
          import time

          def solve(task: dummy_in, config_id: str) -> dummy_out:
              result = dummy_out()
              start_time = time.time()
              try:
                  print(f"Running config: {config_id}")
                  result.override(status="success", module_output="result.zip")
              except Exception as e:
                  result.override(status="failed", error_log=str(e))
              
              result.override(execution_time_seconds = time.time() - start_time)
              return result

          task = dummy_in(pipeline_id="test_pipe")
          res = solve(task, "test_config_01")
          print(f"Test Finished with status: {res['status']}")
          assert res['status'] == "success"

      - name: Final Instance Inspection
        if: always()
        run: |
          echo "Instance File Structure:"
          ls -R