name: "🛰️ Simulators Pipeline Tuning Engine (Core Logic)"

on:
  workflow_call:    # This allows other files to trigger this entire pipeline
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  hourly_guard:
    name: "🕒 Hourly Guard"
    if: "!contains(github.event.head_commit.message, 'Merge branch') && !contains(github.event.head_commit.message, 'Merge pull request')"
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Check last run hour
        id: check
        run: |
          IS_SCHEDULED="${{ github.event_name == 'schedule' }}"

          # If not scheduled (push or manual), always run
          if [[ "$IS_SCHEDULED" != "true" ]]; then
            echo "should_run=yes" >> $GITHUB_OUTPUT
            echo "🚀 Non-scheduled event (push/manual) — always run."
            exit 0
          fi

          # Scheduled event → apply hourly guard
          CURRENT_HOUR=$(date -u +"%Y-%m-%d-%H")
          AUDIT_FILE="performance_audit.md"

          if [ ! -f "$AUDIT_FILE" ]; then
            echo "should_run=yes" >> $GITHUB_OUTPUT
            echo "📄 No audit file yet — first scheduled run allowed."
            exit 0
          fi

          LAST_RUN=$(grep -m1 "### Audit:" "$AUDIT_FILE" | sed 's/### Audit: //; s/ UTC//')
          LAST_RUN_HOUR=$(date -u -d "$LAST_RUN" +"%Y-%m-%d-%H")

          echo "Last run hour: $LAST_RUN_HOUR"
          echo "Current hour:  $CURRENT_HOUR"

          if [ "$CURRENT_HOUR" == "$LAST_RUN_HOUR" ]; then
            echo "should_run=no" >> $GITHUB_OUTPUT
            echo "⏳ Already ran this hour — skipping scheduled run."
          else
            echo "should_run=yes" >> $GITHUB_OUTPUT
            echo "🚀 First scheduled run this hour — proceeding."
          fi

  gatekeeper:
      name: "🚦 Semaphore"
      needs: hourly_guard
      if: needs.hourly_guard.outputs.should_run == 'yes'
      runs-on: ubuntu-latest
      outputs:
        status: ${{ steps.check.outputs.status }}
      steps:
        - name: 🗂️ Checkout Repository
          uses: actions/checkout@v4

        - name: 🔍 Check Dormancy Flag
          id: check
          run: |
            # 1. 🔧 GLOBAL ROBOT IDENTITY INITIALIZATION
            git config --global user.name "Human-Assisted Processing Engine [${{ github.ref_name }}]"
            git config --global user.email "automation-${{ github.ref_name }}@zavalin.com"
            git config --global notes.rewriteRef "refs/notes/*"

            FLAG_PATH="dormant.flag"
            IS_SCHEDULED="${{ github.event_name == 'schedule' }}"

            # 2. LOGIC CHECK
            # If scheduled and DORMANT -> Halt
            if [[ "$IS_SCHEDULED" == "true" ]] && [ -f "$FLAG_PATH" ] && grep -q "STATUS: DORMANT" "$FLAG_PATH"; then
              echo "status=dormant" >> $GITHUB_OUTPUT
              echo "🛑 ENGINE DORMANT: Halting hourly pulse execution."

            # If NOT scheduled (Manual/Push) OR Active -> Wake/Keep Active
            else
              echo "status=active" >> $GITHUB_OUTPUT
              echo "🚀 ENGINE ACTIVE: Proceeding with execution pulse."

              # 3. FORCE ACTIVE STATE (Declarative & Idempotent)
              # This overwrites the file. If it was already ACTIVE, git status will be clean.
              echo "STATUS: ACTIVE" > "$FLAG_PATH"
              git add "$FLAG_PATH"
              
              # Only commit and push if the flag content actually changed
              if [ -n "$(git status --porcelain)" ]; then
                echo "🌅 WAKING ENGINE: State changed to ACTIVE. Syncing..."
                git commit -m "🤖 robot: reset dormant flag to active [Engine]"
                TARGET_COMMIT=$(git rev-parse HEAD)

                # Fetch remote notes
                git fetch origin refs/notes/commits:refs/notes/commits || true

                # Add note locally
                git notes add -f -m "robot: true" "$TARGET_COMMIT"

                # Push commit and notes
                git push origin HEAD
                git push --force origin refs/notes/commits
              else
                echo "✅ Engine already active. No commit required."
              fi
            fi

