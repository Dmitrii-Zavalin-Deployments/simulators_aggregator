  production_run:
    name: "🛠️ Assemble & Tuning"
    # needs: pre_flight_tests
    needs: gatekeeper
    # if: needs.gatekeeper.outputs.status == 'active'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      DROPBOX_FOLDER: "simulators"
      TUNER_STATE_ARCHIVE: "tuning_${{ github.ref_name }}.zip"
      WORKSPACE_DIR: "data/testing-input-output/tuning_${{ github.ref_name }}"
    
    steps:
      - name: 🗂️ Checkout Engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔧 GLOBAL ROBOT IDENTITY + NOTES INITIALIZATION (Branch-Isolated)
      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Human-Assisted Processing Engine [${{ github.ref_name }}]"
          git config --global user.email "automation-${{ github.ref_name }}@zavalin.com"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Engine Pip Dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      
      # 📥 STATE IMPORT: Check if a prior state zip exists on Dropbox
      - name: 📥 Check Pipeline State Existence
        id: import_state
        run: |
          python3 src/io/state_manager.py \
            --folder "${{ env.DROPBOX_FOLDER }}" \
            --filename "${{ env.TUNER_STATE_ARCHIVE }}" >> $GITHUB_OUTPUT
      
      - name: 🔍 Log Pipeline State Status
        run: echo "Current state status is [${{ steps.import_state.outputs.state_status }}]"

      # 📥 WARM START: Download and unpack state archive if found
      - name: 📥 Download Existing State Archive
        if: steps.import_state.outputs.state_status == 'found'
        run: |
          python3 src/io/download_from_dropbox.py \
            --folder "${{ env.DROPBOX_FOLDER }}" \
            --filename "${{ env.TUNER_STATE_ARCHIVE }}"
          
          mkdir -p data/testing-input-output
          unzip -o data/testing-input-output/${{ env.TUNER_STATE_ARCHIVE }} -d data/testing-input-output/

      # Provisions Conda environment for executing simulator modules
      - name: 🐍 Set up Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"
          conda-solver: libmamba
          channels: conda-forge
          channel-priority: strict
          activate-environment: tuner-env

      # HEADLESS GRAPHICS DRIVERS
      - name: 🌐 Install Headless Rendering Dependencies
        run: |
          echo "Installing virtual framebuffer and OpenGL libraries for Gmsh FLTK rendering..."
          sudo apt-get update
          sudo apt-get install -y libgl1 xvfb libglu1-mesa

      # ⚙️ DETERMINISTIC CORE ENGINE (Initialization & Single-Pass Staging)
      - name: ⚙️ Initialize Pipeline State (Cold Start)
        if: steps.import_state.outputs.state_status == 'not_found'
        shell: bash -el {0}
        run: |
          echo "📥 Reading dynamic pipeline targets from task.json..."
          REPO_URL=$(jq -r '.library_repository_url' task.json)
          VERSION_TAG=$(jq -r '.version_tag' task.json)
          
          if [ -z "$REPO_URL" ] || [ -z "$VERSION_TAG" ]; then
              echo "❌ CRITICAL: Failed to parse library specifications from task.json."
              exit 1
          fi

          echo "🗂️ Cloning Payload Library ($VERSION_TAG) from $REPO_URL..."
          mkdir -p repositories
          rm -rf repositories/payload_library
          git clone --depth 1 --branch "$VERSION_TAG" "$REPO_URL" repositories/payload_library
          
          if [ ! -d "repositories/payload_library/.git" ]; then
              echo "❌ CRITICAL: Payload repository clone failed."
              exit 1
          fi
          echo "✅ Payload repository staged successfully."

          # --------------------------------------------------------------------
          # DETERMINISTIC EXECUTION (Single-Pass Execution Strategy)
          # --------------------------------------------------------------------
          echo "🚀 Executing runtime configuration and state initialization..."
          python3 src/pipeline/initialize_state.py --repo-path repositories/payload_library
          
          if [ $? -ne 0 ]; then
              echo "❌ CRITICAL: State initialization pipeline encountered a runtime failure."
              exit 1
          fi
          echo "✅ Pipeline state successfully initialized."

          # --------------------------------------------------------------------
          # --- WORKSPACE HYGIENE ---
          # --------------------------------------------------------------------
          echo -e "\n🧹 Purging local temporary log payloads..."
          rm -f data/testing-input-output/dropbox_download.log
          echo "✅ Workspace hygiene maintained."

