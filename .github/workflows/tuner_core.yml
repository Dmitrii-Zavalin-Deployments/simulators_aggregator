name: "🛰️ Simulators Pipeline Tuning Engine (Core Logic)"

on:
  workflow_call:    # This allows other files to trigger this entire pipeline
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  hourly_guard:
    name: "🕒 Hourly Guard"
    if: "!contains(github.event.head_commit.message, 'Merge branch') && !contains(github.event.head_commit.message, 'Merge pull request')"
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Check last run hour
        id: check
        run: |
          IS_SCHEDULED="${{ github.event_name == 'schedule' }}"

          # If not scheduled (push or manual), always run
          if [[ "$IS_SCHEDULED" != "true" ]]; then
            echo "should_run=yes" >> $GITHUB_OUTPUT
            echo "🚀 Non-scheduled event (push/manual) — always run."
            exit 0
          fi

          # Scheduled event → apply hourly guard
          CURRENT_HOUR=$(date -u +"%Y-%m-%d-%H")
          AUDIT_FILE="performance_audit.md"

          if [ ! -f "$AUDIT_FILE" ]; then
            echo "should_run=yes" >> $GITHUB_OUTPUT
            echo "📄 No audit file yet — first scheduled run allowed."
            exit 0
          fi

          LAST_RUN=$(grep -m1 "### Audit:" "$AUDIT_FILE" | sed 's/### Audit: //; s/ UTC//')
          LAST_RUN_HOUR=$(date -u -d "$LAST_RUN" +"%Y-%m-%d-%H")

          echo "Last run hour: $LAST_RUN_HOUR"
          echo "Current hour:  $CURRENT_HOUR"

          if [ "$CURRENT_HOUR" == "$LAST_RUN_HOUR" ]; then
            echo "should_run=no" >> $GITHUB_OUTPUT
            echo "⏳ Already ran this hour — skipping scheduled run."
          else
            echo "should_run=yes" >> $GITHUB_OUTPUT
            echo "🚀 First scheduled run this hour — proceeding."
          fi
  
  readme_cleaner:
    name: "🧹 Readme cleaner"
    if: contains(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🤖 Initialize Robot A Identity & Notes
        run: |
          BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"
          git config --global user.name "Automation Engine A (${BRANCH_SAFE})"
          git config --global user.email "automation_a+${BRANCH_SAFE}@yourdomain"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: Dynamically Clean and Deduplicate README
        run: |
          python3 - << 'EOF'
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          # 1. Dynamically locate the first '### Audit:' marker
          audit_pos = content.find("### Audit:")
          if audit_pos == -1:
              print("No audit entries found; skipping cleanup.")
              exit(0)

          # 2. Extract the complete dynamic header block as a single unit
          header = content[:audit_pos].rstrip()

          # 3. Create a filter set of all non-empty lines present in the header
          header_lines = {line.strip() for line in header.splitlines() if line.strip()}

          # 4. Filter out any line in the audit history that belongs to the dynamic header
          body = content[audit_pos:]
          cleaned_lines = [line for line in body.splitlines() if line.strip() not in header_lines]
          cleaned_body = "\n".join(cleaned_lines)

          # 5. Isolate and deduplicate audit entries cleanly
          raw_blocks = cleaned_body.split("### Audit:")
          unique_audits = []

          for block in raw_blocks:
              b_stripped = block.strip()
              if b_stripped:
                  entry = f"### Audit: {b_stripped}"
                  if entry not in unique_audits:
                      unique_audits.append(entry)

          # 6. Rebuild README: Atomic Dynamic Header + Deduplicated Audit History
          final_readme = header + "\n\n" + "\n\n".join(unique_audits) + "\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(final_readme)
          EOF

      - name: Commit and Push Cleaned README
        run: |
          git add README.md

          if [ -n "$(git status --porcelain README.md)" ]; then
            git commit -m "🤖 robot a: clean and deduplicate README header [skip ci]"
            TARGET_COMMIT=$(git rev-parse HEAD)

            # Fetch remote notes
            git fetch origin refs/notes/commits:refs/notes/commits || true

            # Attach Git note locally
            git notes add -f -m "robot: true" "$TARGET_COMMIT"

            # Push commit and notes
            git pull origin HEAD --rebase || echo "Rebase failed, pushing without rebase."
            git push origin HEAD
            git push --force origin refs/notes/commits || true
          else
            echo "No README changes required."
          fi

  gatekeeper:
      name: "🚦 Semaphore"
      needs: hourly_guard
      if: needs.hourly_guard.outputs.should_run == 'yes'
      runs-on: ubuntu-latest
      outputs:
        status: ${{ steps.check.outputs.status }}
      steps:
        - name: 🗂️ Checkout Repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: 🔍 Check Dormancy Flag
          id: check
          run: |
            BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"
            git config --global user.name "Automation Engine B (${BRANCH_SAFE})"
            git config --global user.email "automation_b+${BRANCH_SAFE}@yourdomain"
            git config --global notes.rewriteRef "refs/notes/*"

            FLAG_PATH="dormant.flag"
            IS_SCHEDULED="${{ github.event_name == 'schedule' }}"

            # 2. LOGIC CHECK
            # If scheduled and DORMANT -> Halt
            if [[ "$IS_SCHEDULED" == "true" ]] && [ -f "$FLAG_PATH" ] && grep -q "STATUS: DORMANT" "$FLAG_PATH"; then
              echo "status=dormant" >> $GITHUB_OUTPUT
              echo "🛑 ENGINE DORMANT: Halting hourly pulse execution."

            # If NOT scheduled (Manual/Push) OR Active -> Wake/Keep Active
            else
              echo "status=active" >> $GITHUB_OUTPUT
              echo "🚀 ENGINE ACTIVE: Proceeding with execution pulse."

              # 3. FORCE ACTIVE STATE (Declarative & Idempotent)
              # This overwrites the file. If it was already ACTIVE, git status will be clean.
              echo "STATUS: ACTIVE" > "$FLAG_PATH"
              git add "$FLAG_PATH"
              
              # Only commit and push if the flag content actually changed
              if [ -n "$(git status --porcelain)" ]; then
                echo "🌅 WAKING ENGINE: State changed to ACTIVE. Syncing..."
                git commit -m "🤖 robot b: reset dormant flag to active [Engine]"
                
                # 1. Fetch remote notes
                git fetch origin refs/notes/commits:refs/notes/commits || true

                # 2. Add note locally
                TARGET_COMMIT=$(git rev-parse HEAD)
                git notes add -f -m "robot: true" "$TARGET_COMMIT"

                # 3. Pull remote changes with rebase before pushing
                git pull --rebase origin "${{ github.ref_name }}"

                # 4. Push commit and notes
                git push origin HEAD
                git push --force origin refs/notes/commits
              else
                echo "✅ Engine already active. No commit required."
              fi
            fi

  pre_flight_tests:
    name: "📋 Pre-Flight Tests"
    needs: gatekeeper
    if: needs.gatekeeper.outputs.status == 'active'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TEST_COMMAND: "pytest -s tests/ -vv --cov=src --cov-report=term-missing"
    
    steps:
      - name: 🗂️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🤖 Initialize Robot C Identity & Notes
        run: |
          BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"
          git config --global user.name "Automation Engine C (${BRANCH_SAFE})"
          git config --global user.email "automation_c+${BRANCH_SAFE}@yourdomain"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧹 Auto-Clean (Autoflake)
        run: autoflake --in-place --recursive --remove-unused-variables --remove-all-unused-imports src tests

      - name: 🧹 Static Analysis & Lint (Ruff)
        run: ruff check src tests --fix

      - name: 🚀 Commit & Push Hygiene Changes + Sync Notes
        if: always()
        run: |
          # 1. Check if there are local changes to save
          # We check this at the start so we know if we need to use stash/pop
          HAS_CHANGES=$(git status --porcelain)

          # 2. Stash ONLY if there are changes
          if [ -n "$HAS_CHANGES" ]; then
            git stash
          fi
          
          # 3. Fetch and Rebase
          git fetch origin
          # We rebase regardless, so we stay up to date
          git rebase origin/${GITHUB_REF_NAME} || {
            echo "⚠️ Conflict during rebase. Aborting."
            # If we stashed changes, we must pop them back before aborting
            if [ -n "$HAS_CHANGES" ]; then git stash pop; fi
            git rebase --abort
            exit 1
          }

          # 4. Apply the hygiene changes back ONLY if we stashed them
          if [ -n "$HAS_CHANGES" ]; then
            git stash pop || {
              echo "⚠️ Conflict during stash pop. Manual intervention required."
              exit 1
            }
          fi

          # 5. Perform the commit
          # Check for changes, then stage and commit them
          if [ -n "$(git status --porcelain)" ]; then
            git add . 
            # We use git commit -m ... || true to prevent the script from failing 
            # if git somehow finds nothing to commit after the add
            git commit -m "🤖 robot c: auto-clean hygiene update [Engine]" || echo "No changes to commit"
            
            TARGET_COMMIT=$(git rev-parse HEAD)

            # 6. Sync notes
            git fetch origin refs/notes/commits:refs/notes/commits || true
            git notes add -f -m "robot: true" "$TARGET_COMMIT"

            # 7. Push
            git push origin HEAD
            git push --force origin refs/notes/commits
          else
            echo "No hygiene changes detected."
          fi

      - name: 💀 Dead Code Audit (Vulture)
        id: vulture
        run: vulture src --min-confidence 70

      - name: 🧪 Quality Gate Check (Rule 2)
        if: failure() && steps.vulture.outcome == 'failure'
        run: |
          echo "CRITICAL: Rule 2 (Zero-Debt Mandate) violation."
          echo "Unused code detected in src/. Delete unreachable logic before continuing."
          exit 1

      - name: 🧪 Run Logic & Scientific Verification
        run: |
          echo "🚀 Initiating: $TEST_COMMAND"
          $TEST_COMMAND
      
      - name: 🔍 Forensic Audit Testing
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ All systems nominal. No anomalies detected."
            cat <<EOF > debug/forensic_audit_testing.sh
          #!/bin/bash
          # Description: Automated forensic audit for ACE solver failures.
          # Status: Dormant (All systems nominal)
          exit 0
          EOF
            chmod +x debug/forensic_audit_testing.sh
            echo "🧹 Diagnostic script reset to Dormant mode."
          else
            echo "⚠️ CI Failure Detected. Initiating Deep Forensic Audit..."
            echo "============================================================"
            echo "ls -R output:"
            ls -R
            echo "============================================================"
            echo "debug/forensic_audit_testing.sh run results:"
            if [ -f "debug/forensic_audit_testing.sh" ]; then
              bash debug/forensic_audit_testing.sh
            else
              echo "❌ Critical: Diagnostic script 'debug/forensic_audit_testing.sh' not found."
            fi
            echo "============================================================"
            echo "📉 RE-RUNNING FAILED TEST FOR FINAL SIGNAL"
            $TEST_COMMAND || true
            exit 1
          fi
      
      - name: 🧹 Sync Forensic Reset + Sync Notes
        if: success()
        run: |
          git add debug/forensic_audit_testing.sh
          if [ -n "$(git status --porcelain debug/forensic_audit_testing.sh)" ]; then
            git commit -m "🤖 robot c: forensic reset [PASS]"
            TARGET_COMMIT=$(git rev-parse HEAD)

            # 1️⃣ Fetch remote notes FIRST
            git fetch origin refs/notes/commits:refs/notes/commits || true

            # 2️⃣ Add note locally
            git notes add -f -m "robot: true" "$TARGET_COMMIT"

            # 3️⃣ Push commit
            git push origin HEAD

            # 4️⃣ Force-push notes
            git push --force origin refs/notes/commits
          else
            echo "Forensic script already dormant."
          fi

  production_run:
    name: "🛠️ Assemble & Tuning"
    needs: pre_flight_tests
    # needs: gatekeeper
    # if: needs.gatekeeper.outputs.status == 'active'
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.11"
      PYTHONPATH: ${{ github.workspace }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      DROPBOX_FOLDER: "simulators"
      TUNER_STATE_ARCHIVE: "tuning_${{ github.ref_name }}.zip"
      WORKSPACE_DIR: "data/testing-input-output/tuning_${{ github.ref_name }}"
    
    steps:
      - name: 🗂️ Checkout Engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🤖 Initialize Robot D Identity & Notes
        run: |
          BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"
          git config --global user.name "Automation Engine D (${BRANCH_SAFE})"
          git config --global user.email "automation_d+${BRANCH_SAFE}@yourdomain"
          git config --global notes.rewriteRef "refs/notes/*"

      # Setup Python (General base)
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Setup Conda (Creates the target environment)
      - name: 🐍 Set up Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: tuner-env

      # Ensure Pip is installed in the newly created conda environment
      - name: 🛠️ Ensure Pip is installed
        shell: bash -el {0}
        run: conda install -y pip

      # Install dependencies (This will install them into 'tuner-env')
      - name: 📦 Install Engine Pip Dependencies
        shell: bash -el {0}
        run: python -m pip install --no-cache-dir -r requirements.txt
      
      # PIPELINE LOGIC (All Python steps now explicitly use bash -el {0})
      - name: 📥 Check Pipeline State Existence
        id: import_state
        shell: bash -el {0}
        run: |
          python3 src/io/state_manager.py \
            --folder "${{ env.DROPBOX_FOLDER }}" \
            --filename "${{ env.TUNER_STATE_ARCHIVE }}" >> $GITHUB_OUTPUT
      
      - name: 🔍 Log Pipeline State Status
        run: echo "Current state status is [${{ steps.import_state.outputs.state_status }}]"

      # 📥 WARM START: Download and unpack state archive if found
      - name: 📥 Download Existing State Archive
        if: steps.import_state.outputs.state_status == 'found'
        shell: bash -el {0}
        run: |
          python3 src/io/download_from_dropbox.py \
            --folder "${{ env.DROPBOX_FOLDER }}" \
            --filename "${{ env.TUNER_STATE_ARCHIVE }}"
          
          mkdir -p data/testing-input-output
          unzip -o data/testing-input-output/${{ env.TUNER_STATE_ARCHIVE }} -d data/testing-input-output/

      # HEADLESS GRAPHICS DRIVERS
      - name: 🌐 Install Headless Rendering Dependencies
        run: |
          echo "Installing virtual framebuffer and OpenGL libraries for Gmsh FLTK rendering..."
          sudo apt-get update
          sudo apt-get install -y libgl1 xvfb libglu1-mesa

      # ==============================================================================
      # 🛠️ GLOBAL ENVIRONMENT PROVISIONING STEP (Always Runs)
      # ==============================================================================
      - name: 🛠️ Provision Environment Modules
        shell: bash -el {0}
        run: |
          echo "🔄 Running dynamic dependency engine scan..."
          python3 src/pipeline/provision_environment.py

      # ==============================================================================
      # ⚙️ DETERMINISTIC CORE ENGINE & MATRIX GENERATION (Cold Start Only)
      # ==============================================================================
      - name: ⚙️ Initialize Workspace & Explode Range Matrix (Cold Start)
        if: steps.import_state.outputs.state_status == 'not_found'
        shell: bash -el {0}
        run: |
          # 🛑 IMMUNIZATION: Neutralize console clear hook scripts
          echo "" > ~/.bash_logout

          echo "📊 Setting up profiling tracking tools for workspace initialization..."
          rm -f /tmp/cpu_track.log /tmp/memory_profile.log
          
          # Spawn high-frequency active background CPU load sampler
          while true; do
            top -bn1 | grep "Cpu(s)" | awk '{print $2 + $4}' >> /tmp/cpu_track.log 2>/dev/null || true
            sleep 1
          done &
          SAMPLER_PID=$!

          # Open gate to catch manual exit codes safely
          set +e
          START_TIME=$(date +%s)

          # Wrap all initialization actions in a timed, profiled execution block
          /usr/bin/time -v -o /tmp/memory_profile.log bash -c '
            echo "🚀 Executing cold start branch workspace instantiation..."
            python3 src/pipeline/initialize_workspace.py --repo-path repositories/payload_library
            
            # Workspace hygiene handling
            rm -f data/testing-input-output/dropbox_download.log
            echo "✅ Workspace structural configuration mapped safely."

            echo "🧮 Commencing Matrix Range Exploder Sequence..."
            # 1. Find the staged JSON file inside the dynamically constructed directory
            CONFIG_FILE=$(find "${{ env.WORKSPACE_DIR }}/configs" -maxdepth 1 -name "*.json" | head -n 1)

            if [ -z "$CONFIG_FILE" ]; then
              echo "❌ CRITICAL ERROR: Staged configuration asset was not found."
              exit 1
            fi

            # 2. Explode configuration matrix to complete cold start initialization phase
            python3 src/pipeline/matrix_exploder.py \
              --config-path "$CONFIG_FILE" \
              --output-path "${{ env.WORKSPACE_DIR }}/config_combinations_array.json"
          '
          
          RUN_RC=$?
          END_TIME=$(date +%s)
          set -e # Restore default strict environmental security

          # 🛑 Terminate background tracking sampler immediately
          kill $SAMPLER_PID
          
          # 📊 Standard Profile Metrics Output Aggregation
          PEAK_CPU=$(sort -n /tmp/cpu_track.log | tail -n 1)
          if [ -z "$PEAK_CPU" ]; then PEAK_CPU="0.0"; fi
          
          MAX_RSS_KB=$(grep "Maximum resident set size" /tmp/memory_profile.log | awk '{print $6}')
          if [ -z "$MAX_RSS_KB" ]; then
            MAX_RSS_MB=$(free -m | awk '/Mem:/ { print $3 }')
          else
            MAX_RSS_MB=$((MAX_RSS_KB / 1024))
          fi
          TOTAL_MEM_MB=$(free -m | awk '/Mem:/ { print $2 }')

          # Bind active extracted profiling metrics to pipeline environment block (Pre-fixed with INIT_)
          echo "INIT_ACTIVE_PEAK_CPU=${PEAK_CPU}%" >> $GITHUB_ENV
          echo "INIT_ACTIVE_PEAK_MEM=${MAX_RSS_MB}/${TOTAL_MEM_MB}MB" >> $GITHUB_ENV
          echo "INIT_ELAPSED_TIME=$((END_TIME - START_TIME))" >> $GITHUB_ENV
          
          # Stream execution profiles out to the live console summary view
          echo "📋 ========================================================================"
          echo "📋             --- INITIALIZATION PROFILING SUMMARY METRICS ---"
          echo "📋 ========================================================================"
          echo "⏱️ Total Cold Start Duration: $((END_TIME - START_TIME)) seconds"
          echo "🔥 Peak Compute Allocation Load: ${PEAK_CPU}%"
          echo "💾 Peak Resident Memory Footprint: ${MAX_RSS_MB}/${TOTAL_MEM_MB}MB"
          echo "📋 ========================================================================"

          # Enforce proper pipeline step termination if the initialization routine dropped out
          if [ $RUN_RC -ne 0 ]; then
              echo "❌ CRITICAL ERROR: Workspace mapping or matrix explosion phase encountered a failure."
              exit $RUN_RC
          fi
          
          echo "✅ Configuration matrix successfully arrayed."

      - name: 🚀 Execute Unified Pipeline Chain (Warm Start)
        id: execute_pipeline
        if: steps.import_state.outputs.state_status == 'found'
        shell: bash -el {0}
        env:
          WORKSPACE_DIR: "data/testing-input-output/tuning_${{ github.ref_name }}"
          LOG_FILE: "${{ runner.temp }}/pipeline_execution.log"
        run: |
          # 🛑 IMMUNIZATION: Neutralize console clear hook scripts
          echo "" > ~/.bash_logout
          
          echo "🚀 Initiating unified simulator orchestration framework loop..."
          
          # 1. Parse operational runtime constraint definitions from static parameters
          if [ ! -f "config/config.json" ]; then
              echo "❌ CRITICAL ERROR: Global tuner config file asset missing."
              exit 1
          fi
          TIMEOUT_BUDGET=$(jq -r '.max_runtime_seconds' config/config.json)
          echo "SIM_ALLOWED_TIME=${TIMEOUT_BUDGET}" >> $GITHUB_ENV

          # 2. Setup profiling tracking tools
          rm -f /tmp/cpu_track.log /tmp/memory_profile.log
          while true; do
            top -bn1 | grep "Cpu(s)" | awk '{print $2 + $4}' >> /tmp/cpu_track.log 2>/dev/null || true
            sleep 1
          done &
          SAMPLER_PID=$!
          
          # 3. Execute Unified Pipeline Chain under wrapped constraints
          set +e
          START_TIME=$(date +%s)
          
          /usr/bin/time -v -o /tmp/memory_profile.log timeout --foreground "${TIMEOUT_BUDGET}s" \
            python3 src/pipeline/unified_orchestrator.py \
              --state-file "$WORKSPACE_DIR/state.json" \
              --log-file "$LOG_FILE"
          
          RUN_RC=$?
          END_TIME=$(date +%s)
          set -e
          
          # 4. Tear down background analytical hooks
          kill $SAMPLER_PID
          
          # 5. Standard Profile Metrics Output Aggregation
          PEAK_CPU=$(sort -n /tmp/cpu_track.log | tail -n 1 || echo "0.0")
          MAX_RSS_KB=$(grep "Maximum resident set size" /tmp/memory_profile.log | awk '{print $6}' || echo "0")
          MAX_RSS_MB=$((MAX_RSS_KB / 1024))
          TOTAL_MEM_MB=$(free -m | awk '/Mem:/ { print $2 }')
          
          echo "TUNING_ACTIVE_PEAK_CPU=${PEAK_CPU}%" >> $GITHUB_ENV
          echo "TUNING_ACTIVE_PEAK_MEM=${MAX_RSS_MB}/${TOTAL_MEM_MB}MB" >> $GITHUB_ENV
          echo "SIM_ELAPSED_TIME=$((END_TIME - START_TIME))" >> $GITHUB_ENV
          
          # Stream execution profiles out to the live console summary view
          echo "📋 ========================================================================"
          echo "📋             --- PIPELINE EXECUTION PROFILING SUMMARY METRICS ---"
          echo "📋 ========================================================================"
          echo "⏱️ Total Loop Duration: $((END_TIME - START_TIME)) seconds"
          echo "🔥 Peak Compute Allocation Load: ${PEAK_CPU}%"
          echo "💾 Peak Resident Memory Footprint: ${MAX_RSS_MB}/${TOTAL_MEM_MB}MB"
          echo "📋 ========================================================================"

          # 6. Stream Live Console Logs Back to GitHub Execution Window Interface
          echo "📋 ========================================================================"
          echo "📋             --- UNIFIED SEQUENTIAL PROCESSING CHAIN RUN LOGS ---"
          echo "📋 ========================================================================"
          if [ -f "$LOG_FILE" ]; then cat "$LOG_FILE"; else echo "❌ Error: Log file was not created."; fi
          echo "📋 ========================================================================"
          
          # 7. Hand over result directly to Telemetry System Record
          echo "📊 Staging runtime execution telemetry..."
          set +e
          python3 src/pipeline/record_telemetry.py \
            --state-file "$WORKSPACE_DIR/state.json" \
            --exit-code $RUN_RC \
            --log-file "$LOG_FILE"
          TELEMETRY_RC=$?
          set -e

          # 8. Flow Control Reporting Outputs
          if [ $RUN_RC -eq 124 ]; then
              echo "❌ TIMEOUT ENCOUNTERED: Module exceeded allowed window of ${TIMEOUT_BUDGET}s."
              echo "SIMULATION_STATUS=TIMEOUT" >> $GITHUB_ENV
              STATUS="TIMEOUT"
          elif [ $RUN_RC -ne 0 ]; then
              echo "⚠️ Simulation reported failure (Exit Code: $RUN_RC)."
              echo "   This is handled as a known outcome in tuning. Continuing pipeline flow..."
              echo "SIMULATION_STATUS=FAILED" >> $GITHUB_ENV
              STATUS="FAILED"
          else
              echo "✅ All loop simulation instances completed successfully."
              echo "SIMULATION_STATUS=SUCCESS" >> $GITHUB_ENV
              STATUS="SUCCESS"
          fi

          # Expose status field directly to the runner engine context layer
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          # exit 0
          exit 1

      - name: 📤 Package and Upload State Snapshot
        shell: bash -el {0}
        run: |
          if [ -d "${{ env.WORKSPACE_DIR }}" ]; then
            echo "📦 Packing active state folder..."
            
            # Defensive check and cleanup for the phantom 'config' directory
            CONFIG_DIR="${{ env.WORKSPACE_DIR }}/config"
            if [ -d "$CONFIG_DIR" ]; then
              if rmdir "$CONFIG_DIR" 2>/dev/null; then
                echo "✅ Phantom 'config' directory found and successfully removed."
              else
                echo "❌ CRITICAL: Directory '$CONFIG_DIR' is not empty and cannot be removed."
                echo "   This indicates an unexpected dependency or data leak."
                exit 1
              fi
            else
              echo "ℹ️ No phantom 'config' directory detected. Proceeding."
            fi
            
            cd data/testing-input-output/
            zip -r "${{ env.TUNER_STATE_ARCHIVE }}" "tuning_${{ github.ref_name }}"
            cd ../..
            
            echo "📤 Uploading updated transaction state to Dropbox..."
            python3 src/io/upload_to_dropbox.py \
              --folder "${{ env.DROPBOX_FOLDER }}" \
              --filename "${{ env.TUNER_STATE_ARCHIVE }}"
          fi
        
      - name: 🔍 Forensic Audit Production
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ All systems nominal. No anomalies detected."
            cat <<EOF > debug/forensic_audit_production.sh
          #!/bin/bash
          # Description: Automated forensic audit for ACE solver failures.
          # Status: Dormant (All systems nominal)
          exit 0
          EOF
            chmod +x debug/forensic_audit_production.sh
            echo "🧹 Diagnostic script reset to Dormant mode."
          else
            echo "⚠️ CI Failure Detected. Initiating Deep Forensic Audit..."
            echo "============================================================"
            echo "ls -R output:"
            ls -R
            echo "============================================================"
            echo "debug/forensic_audit_production.sh run results:"
            if [ -f "debug/forensic_audit_production.sh" ]; then
              bash debug/forensic_audit_production.sh
            else
              echo "❌ Critical: Diagnostic script 'debug/forensic_audit_production.sh' not found."
            fi
            echo "============================================================"
            echo "📉 RE-RUNNING FAILED TEST FOR FINAL SIGNAL"
            $TEST_COMMAND || true
            exit 1
          fi

      - name: 📊 Audit Performance Ledger & Sync (Assemble & Tuning)
        if: always()
        env:
          TASK_NAME: "Assemble & Tuning"
        run: |
          # Dynamically extract pipeline_id from the state workspace asset
          STATE_FILE="data/testing-input-output/tuning_${{ github.ref_name }}/state.json"
          
          if [ -f "$STATE_FILE" ]; then
              # Parse pipeline_id using jq, fallback to default name if empty
              EXTRACTED_ID=$(jq -r '.pipeline_id' "$STATE_FILE" 2>/dev/null)
              TASK_NAME="${EXTRACTED_ID:-"Assemble & Tuning (Fallback)"}"
              echo "✅ Successfully parsed active execution context: $TASK_NAME"
          else
              echo "⚠️ Warning: State file not found at $STATE_FILE. Using fallback task name."
              TASK_NAME="Assemble & Tuning (Disconnected)"
          fi

          # ⏱️ EXTRACT TIMING AND STATUS METRICS FROM ENVIRONMENT CONTEXT
          SIM_STATE="${{ env.SIMULATION_STATUS }}"
          SIM_ALLOWED="${{ env.SIM_ALLOWED_TIME }}"
          SIM_ELAPSED="${{ env.SIM_ELAPSED_TIME }}"

          # Handle fallback scenarios in case the run step crashed or was skipped entirely
          SIM_ALLOWED="${SIM_ALLOWED:-0}"
          SIM_ELAPSED="${SIM_ELAPSED:-0}"

          if [ "$SIM_STATE" = "TIMEOUT" ]; then
              SIM_STATE_LABEL="timeout"
          elif [ "$SIM_STATE" = "SUCCESS" ]; then
              SIM_STATE_LABEL="success"
          elif [ "$SIM_STATE" = "FAILED" ]; then
              SIM_STATE_LABEL="failed"
          else
              SIM_STATE_LABEL="skipped/error"
          fi

          echo "📊 Commencing performance audit ledger generation for task: $TASK_NAME..."

          # Collect environment performance metrics
          RUN_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          STATUS="${{ job.status }}"
          CURRENT_BRANCH=${GITHUB_REF##*/}
          
          # Inject true runtime execution peak metrics, falling back to system calls if pipeline was skipped/aborted
          CPU_LOAD="${TUNING_ACTIVE_PEAK_CPU:-$(top -bn1 | grep "Cpu(s)" | awk '{print $2 + $4 "%"}')}"
          MEM_USAGE="${TUNING_ACTIVE_PEAK_MEM:-$(free -m | awk '/Mem:/ { print $3 "/" $2 "MB" }')}"

          # Build the Markdown entry with the accurate Task and Runtime metadata
          # Construct the URL for the current run
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          NEW_ENTRY=$(cat <<EOF
          ### Audit: $RUN_DATE
          - **Pipeline:** \`$TASK_NAME\`
          - **Branch:** \`$CURRENT_BRANCH\`
          - **Status:** \`$STATUS\`
          - **Run:** [Detailed Execution Logs]($RUN_URL)
          - **Modules Runtime:** Used ${SIM_ELAPSED} of ${SIM_ALLOWED} seconds (${SIM_STATE_LABEL})
          - **CPU Load:** \`$CPU_LOAD\`
          - **Memory Usage:** \`$MEM_USAGE\`
          EOF
          )

          # 📦 ISOLATION PHASE 1: Protect current dirty workspace before PULL 1
          echo "📦 Stashing all local modifications to isolate workspace for baseline sync..."
          git stash push --include-untracked -m "pre-audit-baseline-isolation" || true

          # 🔄 PULL 1: Clear out baseline modifications before injecting text to minimize file drift variance
          echo "📥 Executing First Pull to capture baseline state..."
          git pull origin ${{ github.ref_name }} --rebase -X ours || true

          # 📤 RESTORE PHASE 1: Bring back workspace modifications to prepare for generation
          echo "📤 Restoring workspace modifications post-baseline sync..."
          git stash pop || echo "📋 Workspace pristine or no stash required."

          # Inject entry at the top of the file directly under the header
          HEADER=$(cat <<'EOF'
          # 🛰️ Simulators Aggregator
          Tunes the aggregated simulators pipelines, tracking execution telemetry, resource utilization, and runtime performance history.

          ### 📚 Resources & Documentation
          - **Tutorial/Book:** ***currently in development***

          ---

          ### 🧮 Performance Audit:
          EOF
          )

          if [ -f "README.md" ]; then
              # Extract everything after the first audit entry to preserve historical runs
              sed -n '/### Audit:/,$p' README.md > old_body.tmp
              echo "$HEADER" > README.md
              echo "$NEW_ENTRY" >> README.md
              cat old_body.tmp >> README.md
              rm old_body.tmp
          else
              # Initialize new README
              echo "$HEADER" > README.md
              echo "$NEW_ENTRY" >> README.md
          fi

          # 📦 ISOLATION PHASE 2: Clear workspace for final sync against concurrent job drift
          echo "📦 Stashing updated ledger and tracking assets for final serialization sync..."
          git stash push --include-untracked -m "pre-commit-sync-isolation" || true

          # 🔄 PULL 2: Grab updates made by parallel jobs that finished during the local file generation phase
          echo "🔄 Executing Second Pull immediately prior to commit serialization..."
          git pull origin ${{ github.ref_name }} --rebase -X ours

          # 📤 RESTORE PHASE 2: Restore modifications cleanly over the updated upstream base
          echo "📤 Restoring isolated workspace modifications..."
          git stash pop || echo "📋 Workspace modifications restored safely."

          # ISOLATED COMMIT & PUSH
          # Explicitly target only the public ledger for the final commit
          git add README.md dormant.flag debug/forensic_audit_production.sh

          if [ -n "$(git status --porcelain README.md)" ]; then
            git commit -m "🤖 robot d: audit ledger update [$STATUS] [skip ci]"
            TARGET_COMMIT=$(git rev-parse HEAD)

            # Sync and attach metadata notes
            git fetch origin refs/notes/commits:refs/notes/commits || true
            git notes add -f -m "robot: true" "$TARGET_COMMIT"
            
            # Final transmission out to the remote tracking branch
            git push origin HEAD
            git push --force origin refs/notes/commits || true
          else
            echo "📋 Notice: No ledger modifications detected. Skipping commit loop."
          fi

      - name: 🛡️ Pre-Dissolving Integrity Audit
        if: steps.execute_pipeline.outputs.status != 'TIMEOUT'
        shell: bash -el {0}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "🔍 --- STARTING INTEGRITY AUDIT ---"

          # 1. CONDA VALIDATION
          echo -e "\n🧩 --- CONDA ENVIRONMENT ---"
          if conda list pythonocc-core | grep -q "pythonocc-core"; then
              echo "✅ pythonocc-core is installed."
              conda list pythonocc-core | grep pythonocc-core
          else
              echo "❌ CRITICAL: pythonocc-core is MISSING."
              exit 1
          fi

          # 2. PIP DEPENDENCY VALIDATION
          echo -e "\n📦 --- PIP PACKAGE VALIDATION ---"
          REQUIRED_PKGS=("numpy" "h5py" "requests" "jsonschema")

          for pkg in "${REQUIRED_PKGS[@]}"; do
              if pip show "$pkg" > /dev/null 2>&1; then
                  echo "✅ $pkg is installed:"
                  pip show "$pkg" | grep -E "Name:|Version:"
              else
                  echo "❌ CRITICAL: $pkg is MISSING."
                  exit 1
              fi
          done

          # 3. INTEGRITY CHECK
          echo -e "\n🛡️ --- DEPENDENCY INTEGRITY CHECK ---"
          if pip check; then
              echo "✅ No dependency conflicts found."
          else
              echo "⚠️ WARNING: Potential dependency conflicts detected."
          fi

          # 4. SOVEREIGN STATE VERIFICATION
          echo -e "\n📂 --- SOVEREIGN STATE VERIFICATION ---"
          BRANCH="${GITHUB_REF_NAME:-main}"
          STATE_DIR="data/testing-input-output/tuning_${BRANCH}"
          PARENT_DIR="data/testing-input-output"

          # --- GLOBAL SCOPE AUDIT ---
          echo -e "\n--- FULL SCOPE DIRECTORY LISTING (data/testing-input-output) ---"
          if [ -d "$PARENT_DIR" ]; then
              ls -R "$PARENT_DIR"
          else
              echo "⚠️ Parent directory $PARENT_DIR does not exist."
          fi

          echo -e "\n✅ --- INTEGRITY AUDIT COMPLETE ---"

      - name: 🛠️ Retroactive Git Notes Corrector (All Automation Engines)
        if: always()
        run: |
          echo "--- Starting Retroactive Git Notes Audit (All History) ---"
          
          git fetch origin refs/notes/commits:refs/notes/commits || true

          COMMIT_HASHES=$(git log --format="%H %an" | grep -E "Automation Engine" | awk '{print $1}')
          ACTIVE_ENGINES=$(git log --format="%an" | grep -E "Automation Engine" | sort -u | tr '\n' ', ' | sed 's/,$//')

          if [ -z "$COMMIT_HASHES" ]; then
            echo "No automation engine commits found in history."
          else
            TOTAL_COMMITS=0
            ADDED_NOTES=0

            for COMMIT in $COMMIT_HASHES; do
              TOTAL_COMMITS=$((TOTAL_COMMITS + 1))
              
              if ! git notes show "$COMMIT" >/dev/null 2>&1; then
                echo "⚠️ Missing note detected for commit: $COMMIT. Adding note..."
                git notes add -f -m "robot: true" "$COMMIT"
                ADDED_NOTES=$((ADDED_NOTES + 1))
              fi
            done

            echo "--------------------------------------------------"
            echo "📊 Git Notes Audit Summary:"
            echo "   - Active Automation Engines:       [ ${ACTIVE_ENGINES:-None} ]"
            echo "   - Total Automation Commits Scanned: $TOTAL_COMMITS"
            echo "   - Missing Notes Fixed & Added:      $ADDED_NOTES"
            echo "--------------------------------------------------"

            echo "Pushing updated notes to remote..."
            git push --force origin refs/notes/commits || echo "Notes push skipped or protected."
          fi