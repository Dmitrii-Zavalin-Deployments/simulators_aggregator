      #       git stash pop
            
      #       # Re-add after rebase to ensure clean state
      #       git add performance_audit.md dormant.flag config/orchestration_ledger.json
      #       git commit -m "🤖 robot: ACE cycle complete | status=${{ job.status }}"
      #       TARGET_COMMIT=$(git rev-parse HEAD)

      #       # 1️⃣ Fetch remote notes FIRST
      #       git fetch origin refs/notes/commits:refs/notes/commits || true

      #       # 2️⃣ Add note locally
      #       git notes add -f -m "robot: true" "$TARGET_COMMIT"

