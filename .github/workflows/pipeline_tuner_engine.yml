  production_run:
    name: "🚀 Production: ACE Loop Execution"
    # needs: pre_flight_tests
    needs: gatekeeper
    if: needs.gatekeeper.outputs.status == 'active'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      DROPBOX_FOLDER: "simulators"
      TUNER_STATE_ARCHIVE: "tuning_${{ github.ref_name }}.zip"
      WORKSPACE_DIR: "data/testing-input-output/tuning_${{ github.ref_name }}"
    
    steps:
      - name: 🗂️ Checkout Engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔧 GLOBAL ROBOT IDENTITY + NOTES INITIALIZATION (Branch-Isolated)
      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine [${{ github.ref_name }}]"
          git config --global user.email "automation-${{ github.ref_name }}@yourdomain.com"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Engine Pip Dependencies
        run: pip install -r requirements.txt
      
      # 📥 STATE IMPORT: Check if a prior state zip exists on Dropbox
      - name: 📥 Check Pipeline State Existence
        id: import_state
        run: |
          python3 src/io/state_manager.py \
            --folder "${{ env.DROPBOX_FOLDER }}" \
            --filename "${{ env.TUNER_STATE_ARCHIVE }}" >> $GITHUB_OUTPUT
      
      - name: 🔍 Log Pipeline State Status
        run: echo "Current state status is [${{ steps.import_state.outputs.state_status }}]"

      # 📥 WARM START: Download and unpack state archive if found
      - name: 📥 Download Existing State Archive
        if: steps.import_state.outputs.state_status == 'found'
        run: |
          python3 src/io/download_from_dropbox.py \
            --folder "${{ env.DROPBOX_FOLDER }}" \
            --filename "${{ env.TUNER_STATE_ARCHIVE }}"
          
          mkdir -p data/testing-input-output
          unzip -o data/testing-input-output/${{ env.TUNER_STATE_ARCHIVE }} -d data/testing-input-output/

      # 🐍 ENV CAPABILITY: Provisions Conda environment for executing simulator modules
      - name: 🐍 Set up Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"
          channels: conda-forge
          channel-priority: strict
          activate-environment: tuner-env

      - name: 📦 Cache Conda Environment
        id: cache-conda
        uses: actions/cache@v4
        with:
          path: /usr/share/miniconda/envs/tuner-env
          key: ${{ hashFiles('tasks/**') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ hashFiles('tasks/**') }}-${{ github.ref_name }}-

      # ⚙️ COLD START ONLY (Initialization & Parameter Explosion)
      - name: ⚙️ Initialize Pipeline State (Cold Start)
        if: steps.import_state.outputs.state_status == 'not_found'
        shell: bash -el {0}
        run: |
          echo "📥 Cold Start Detected: Scaffolding baseline files..."
          mkdir -p repositories
          rm -rf repositories/fluid_dynamics_simulator
          git clone https://github.com/Dmitrii-Zavalin-Deployments/fluid_dynamics_simulator.git repositories/fluid_dynamics_simulator
          
          if [ ! -d "repositories/fluid_dynamics_simulator/.git" ]; then
              echo "❌ ERROR: Repository clone failed."
              exit 1
          fi
          echo "✅ Repository staged successfully."

          echo "🚀 Running state initialization logic..."
          conda activate tuner-env

          # Build the command dynamically without risking the Python string evaluation trap
          CMD="python3 src/pipeline/initialize_state.py --repo-path repositories/fluid_dynamics_simulator"
          
          if [ "${{ steps.cache-conda.outputs.cache-hit }}" == "true" ]; then
              echo "💡 Conda cache hit achieved. Appending --cached-dependency to skip setup scripts."
              CMD="$CMD --cached-dependency"
          fi
          $CMD

      - name: 🧮 Explode Configuration Range Matrix (Cold Start)
        if: steps.import_state.outputs.state_status == 'not_found'
        shell: bash -el {0}
        run: |
          python3 src/pipeline/matrix_exploder.py \
            --config-path "${{ env.WORKSPACE_DIR }}/configs/mesh_config_0970b4d.json" \
            --output-path "${{ env.WORKSPACE_DIR }}/config_combinations_array.json"

      - name: ⚙️ Initialize Pipeline State (Warm Start)
        if: steps.import_state.outputs.state_status == 'found' 
        shell: bash -el {0}
        env:
          WORKSPACE_DIR: "data/testing-input-output/tuning_${{ github.ref_name }}"
        run: |
          echo "📥 Warm Start Detected: Initializing from $WORKSPACE_DIR..."
          
          if [ ! -f "$WORKSPACE_DIR/state.json" ]; then
            echo "❌ ERROR: State file not found."
            exit 1
          fi

          Generate and Execute provisioning (Cloning + Config Injection ONLY)
          PROVISION_CMD=$(python3 src/pipeline/generate_provision_cmd.py --state-file "$WORKSPACE_DIR/state.json")
          eval "$PROVISION_CMD"
          
          if [ $? -eq 0 ]; then
            echo "✅ Repositories staged successfully."
          else
            echo "❌ ERROR: Repository staging failed."
            exit 1
          fi

