name: "ACE Pipeline Tuner Engine"

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    # Hourly Pulse: Wakes up at the top of every hour to execute a batch
    - cron: '0 * * * *'

jobs:
  gatekeeper:
    name: "🛑 Engine Gatekeeper"
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: 🗂️ Checkout Repository
        uses: actions/checkout@v4

      # Rule 1: Isolation Mandate. Circuit breaker for the Pulsed Batch.
      - name: 🔍 Check Dormancy Flag
        id: check
        run: |
          FLAG_PATH="config/dormant.flag"
          
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [ -f "$FLAG_PATH" ] && grep -q "STATUS: DORMANT" "$FLAG_PATH"; then
              echo "status=dormant" >> $GITHUB_OUTPUT
              echo "🛑 ENGINE DORMANT: Status set to DORMANT. Halting pulse."
            else
              echo "status=active" >> $GITHUB_OUTPUT
              echo "🚀 ENGINE ACTIVE: No dormancy signal found. Proceeding."
            fi
          else
            echo "status=active" >> $GITHUB_OUTPUT
            echo "🚀 AUTO-WAKE: Manual or Push trigger detected. Activating Engine."
          fi

