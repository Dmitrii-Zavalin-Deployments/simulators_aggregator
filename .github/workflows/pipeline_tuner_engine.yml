  production_run:
    name: "🚀 Production: ACE Loop Execution"
    # needs: pre_flight_tests
    needs: gatekeeper
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      DROPBOX_APP_KEY: ${{ secrets.APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
    
    steps:
      - name: 🗂️ Checkout Engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔧 GLOBAL ROBOT IDENTITY + NOTES INITIALIZATION (Branch-Isolated)
      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine [${{ github.ref_name }}]"
          git config --global user.email "automation-${{ github.ref_name }}@yourdomain.com"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt
      
      - name: 🧬 Clone Simulator Library
        run: |
          # Ensure target directory exists and clear old artifacts if necessary
          mkdir -p repositories
          
          # Perform the clone
          git clone https://github.com/Dmitrii-Zavalin-Deployments/fluid_dynamics_simulator.git repositories/fluid_dynamics_simulator
          
          # Explicit verification check
          if [ -d "repositories/fluid_dynamics_simulator" ]; then
            echo "✅ SUCCESS: Simulator library verified at: repositories/fluid_dynamics_simulator"
            # Optional: verify that it is actually a git repo by checking for .git folder
            if [ -d "repositories/fluid_dynamics_simulator/.git" ]; then
                echo "✅ Git integrity confirmed."
            else
                echo "❌ Error: Directory exists but is not a valid git repository!"
                exit 1
            fi
          else
            echo "❌ ERROR: Clone failed. Directory 'repositories/fluid_dynamics_simulator' not found."
            exit 1
          fi
      
      - name: 📥 Import Pipeline State
        id: import_state
        run: |
          STATUS=$(python3 src/io/state_manager.py --action import)
          echo "status=$STATUS" >> $GITHUB_OUTPUT

